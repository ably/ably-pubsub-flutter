name: ably_flutter_integration_test
description: Integration tests for Ably Flutter plugin.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  ably_flutter:
    path: ".."

  args: ^2.3.1
  enum_to_string: ^2.0.1
  http: ^0.13.4

dev_dependencies:
  flutter_driver:
    sdk: flutter
  test: ^1.21.1
  flutter_lints: ^1.0.4

flutter:
  # Flutter 3.44 turns Swift Package Manager on by default, and building this
  # app would migrate its Xcode project off CocoaPods on the spot. Hold that
  # off so the migration can land as its own reviewable commit rather than as
  # a side effect of a version bump.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
